name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '1 * * * *'
      timezone: America/Chicago

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: URL Health Check
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fso-11-pokedex-jkhl.onrender.com/health|https://fso-11-pokedex-jkhl.onrender.com/health
          max-attempts: 5
          retry-delay: 10s
