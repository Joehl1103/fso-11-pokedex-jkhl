name: Hello World!

on:
  push:
    branches:
      - master

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: check out
        run: actions/checkout@v4
      - name: Say hello
        run: |
          echo "Hello World!"
      - name: print date
        run: date
      - name: contents of dir
        run: |
          pwd
          ls -l
