name: Deployment pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    types: [opened, synchronize]

jobs:
  prep_for_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Test
        run: npm run test
      - name: Test e2e
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Build
        if: ${{ github.event_name == 'push' }}
        run: webpack --mode production
  deploy:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [prep_for_deploy]
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Fly.io Deploy 1
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly.io Deploy 2
        run: flyctl deploy --config fly.toml --remote-only --strategy canary --wait-timeout 30s
      - name: Render deploy
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
  tag_release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
