name: Deployment pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    types: [opened, synchronize]

jobs:
  prep_for_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check style
        run: npm run eslint
      - name: Test
        run: npm run test
      - name: Build
        if: ${{ github.event_name == 'push' }}
        run: webpack --mode production
      - name: Notify
        if: ${{ failure() }}
        uses: ./.github/actions
        with:
          job-name: prep_for_deploy
          status: ${{ job.status }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Test e2e
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Notify
        if: ${{ failure() }}
        uses: ./.github/actions
        with:
          job-name: e2e
          status: ${{ job.status }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}

  deploy_fly:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [prep_for_deploy, e2e]
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Fly.io Deploy 1
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly.io Deploy 2
        run: flyctl deploy --config fly.toml --remote-only --strategy canary --wait-timeout 30s
      - name: Notify
        if: ${{ always() }}
        uses: ./.github/actions
        with:
          job-name: deploy-fly
          status: ${{ job.status }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}

  deploy_render:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [prep_for_deploy, e2e]
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Render deploy
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Notify
        if: ${{ always() }}
        uses: ./.github/actions
        with:
          job-name: deploy_render
          status: ${{ job.status }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}

  tag_release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [deploy_fly, deploy_render]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        if: ${{ contains(toJson(github.event.commits.*.message),'#skip') }}
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
