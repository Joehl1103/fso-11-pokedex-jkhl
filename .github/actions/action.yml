name: notifications

description: discord notification

inputs:
  job-name:
    required: true
  status:
    required: true
  discord-webhook:
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
    - uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ inputs.discord-webhook }}
        content: |
          Hey <@948036101346586636>.
          Job name: ${{ inputs.job-name }}
          Job status: ${{ inputs.status }}
        title: 'status'
        description: 'notifies of status'
        color: 0x0000ff
        url: 'https://github.com/sarisia/actions-status-discord'
        username: GitHub Actions
